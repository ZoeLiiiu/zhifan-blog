<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>知返 · 管理后台</title>
    <link rel="stylesheet" href="./content.css" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <main class="login-shell" data-login-view>
      <section class="login-card">
        <p class="eyebrow"><span></span> ZHIFAN / ADMIN</p>
        <h1>回到文字里。</h1>
        <p>管理后台仅通过服务器安全通道访问。</p>
        <form data-login-form>
          <label>
            管理员账号
            <input name="username" autocomplete="username" value="zhifan" required />
          </label>
          <label>
            管理密码
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="button button-primary" type="submit">进入后台 <span>→</span></button>
          <p class="form-message" data-login-message aria-live="polite"></p>
        </form>
      </section>
    </main>

    <main class="admin-shell" data-admin-view hidden>
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark"><i></i><i></i></span><span><strong>知返</strong><small>ZHIFAN / ADMIN</small></span></div>
        <nav>
          <button class="nav-active" type="button">文章管理 <span data-total-count>0</span></button>
          <button type="button" data-new-article>新建文章 <span>＋</span></button>
          <button type="button" data-publish-all>重新发布 <span>↗</span></button>
        </nav>
        <div class="sidebar-note"><strong>慢慢写，也认真发布。</strong><span>公开文章会自动同步到 GitHub Pages。</span></div>
        <button class="signout" type="button" data-logout>退出登录</button>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow"><span></span> CONTENT STUDIO</p>
            <h1>文章管理</h1>
          </div>
          <div class="publish-state" data-publish-state>等待操作</div>
        </header>

        <div class="content-layout">
          <section class="article-panel">
            <div class="panel-tools">
              <input type="search" placeholder="搜索文章…" aria-label="搜索文章" data-search />
              <select aria-label="筛选状态" data-filter>
                <option value="all">全部状态</option>
                <option value="published">已发布</option>
                <option value="draft">草稿</option>
                <option value="archived">已归档</option>
              </select>
            </div>
            <div class="article-list" data-article-list></div>
          </section>

          <section class="editor-panel">
            <div class="editor-heading">
              <div>
                <p class="eyebrow"><span></span> EDITOR</p>
                <h2 data-editor-title>新建文章</h2>
              </div>
              <button class="text-button danger" type="button" data-delete hidden>删除文章</button>
            </div>

            <form data-editor-form>
              <div class="field-row">
                <label>分类
                  <select name="category" required>
                    <option value="项目经验">项目经验</option>
                    <option value="生活随想">生活随想</option>
                  </select>
                </label>
                <label>显示日期
                  <input name="date" placeholder="2026.07.27" required maxlength="32" />
                </label>
                <label>阅读时间
                  <input name="readTime" placeholder="6 分钟" required maxlength="32" />
                </label>
              </div>

              <label>标题
                <input name="title" placeholder="写下这篇文章的标题" required maxlength="160" />
              </label>
              <label>摘要
                <textarea name="excerpt" rows="3" placeholder="用一两句话介绍这篇文章" maxlength="500"></textarea>
              </label>
              <div class="content-editor" data-content-editor>
                <input name="contentFormat" type="hidden" value="markdown" />
                <div class="format-notice" data-format-notice hidden>
                  <span>这是一篇旧的纯文本文章，当前会保持原样显示。</span>
                  <button type="button" data-upgrade-format>升级为多格式文章</button>
                </div>
                <div class="editor-toolbar" data-markdown-toolbar>
                  <div class="toolbar-group" aria-label="文字格式">
                    <button type="button" data-md-action="heading" title="二级标题">H2</button>
                    <button type="button" data-md-action="bold" title="粗体"><strong>B</strong></button>
                    <button type="button" data-md-action="italic" title="斜体"><em>I</em></button>
                    <button type="button" data-md-action="quote" title="引用">❞</button>
                    <button type="button" data-md-action="unordered-list" title="无序列表">• 列表</button>
                    <button type="button" data-md-action="ordered-list" title="有序列表">1. 列表</button>
                  </div>
                  <div class="toolbar-group" aria-label="插入内容">
                    <button type="button" data-md-action="link">链接</button>
                    <button type="button" data-open-media="image">图片</button>
                    <button type="button" data-open-media="video">视频</button>
                    <button type="button" data-md-action="inline-code">行内代码</button>
                    <button type="button" data-md-action="code">代码块</button>
                    <button type="button" data-md-action="table">表格</button>
                    <button type="button" data-md-action="divider">分隔线</button>
                  </div>
                  <div class="editor-tabs" aria-label="编辑视图">
                    <button class="active" type="button" data-editor-tab="write">编辑</button>
                    <button type="button" data-editor-tab="preview">预览</button>
                  </div>
                </div>
                <section class="paste-upload-panel" data-paste-upload-panel hidden aria-live="polite">
                  <div class="paste-upload-heading">
                    <span><strong>粘贴图片上传</strong><small data-paste-upload-summary>可直接在正文中粘贴截图或复制的图片</small></span>
                    <button type="button" data-cancel-paste-upload hidden>取消当前上传</button>
                  </div>
                  <div class="paste-upload-list" data-paste-upload-list></div>
                </section>
                <div class="content-editor-grid" data-editor-grid>
                  <label class="body-source">正文（Markdown）
                    <textarea name="body" rows="20" placeholder="从这里开始写…可直接粘贴截图或图片" maxlength="100000"></textarea>
                  </label>
                  <section class="body-preview" aria-label="文章实时预览">
                    <div class="preview-label">实时预览</div>
                    <div data-content-preview></div>
                  </section>
                </div>
              </div>

              <div class="field-row">
                <label>状态
                  <select name="status">
                    <option value="draft">草稿</option>
                    <option value="published">已发布</option>
                    <option value="archived">已归档</option>
                  </select>
                </label>
              </div>

              <div class="editor-actions">
                <p data-editor-message aria-live="polite"></p>
                <div>
                  <button class="button button-secondary" type="submit">保存更改</button>
                  <button class="button button-primary" type="button" data-publish>发布文章 <span>↗</span></button>
                </div>
              </div>
            </form>
          </section>
        </div>
      </section>
    </main>

    <dialog data-delete-dialog>
      <p class="eyebrow"><span></span> 确认删除</p>
      <h2>要删除这篇文章吗？</h2>
      <p data-delete-copy></p>
      <div>
        <button class="button button-secondary" type="button" data-cancel-delete>先不删</button>
        <button class="button button-danger" type="button" data-confirm-delete>确认删除</button>
      </div>
    </dialog>

    <dialog class="media-dialog" data-media-dialog>
      <form data-media-form>
        <div class="media-dialog-heading">
          <div>
            <p class="eyebrow"><span></span> MEDIA LIBRARY</p>
            <h2 data-media-title>插入图片</h2>
          </div>
          <button class="dialog-close" type="button" data-close-media aria-label="关闭">×</button>
        </div>
        <p class="media-help" data-media-help>支持 JPEG、PNG、WebP，单张不超过 10 MiB。</p>
        <input name="kind" type="hidden" value="image" />
        <label>选择本地文件
          <input name="file" type="file" accept="image/jpeg,image/png,image/webp" />
        </label>
        <label data-image-alt>图片替代文字
          <input name="alt" maxlength="160" placeholder="简要描述图片内容" />
        </label>
        <label>标题或说明
          <input name="caption" maxlength="160" placeholder="可选" />
        </label>
        <div class="upload-progress" data-upload-progress hidden>
          <span data-upload-label>正在上传…</span>
          <progress max="100" value="0" data-upload-meter></progress>
        </div>
        <p class="form-message" data-media-message aria-live="polite"></p>
        <div class="media-actions">
          <button class="button button-secondary" type="button" data-cancel-upload>取消</button>
          <button class="button button-primary" type="submit">上传并插入</button>
        </div>
        <div class="media-library">
          <div class="media-library-heading"><strong>已上传媒体</strong><button type="button" data-refresh-media>刷新</button></div>
          <div data-media-list><p class="empty">登录后读取媒体库</p></div>
        </div>
      </form>
    </dialog>

    <script src="./content-renderer.js" defer></script>
    <script src="./admin.js" defer></script>
  </body>
</html>
